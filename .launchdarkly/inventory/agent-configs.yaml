# Desired AgentControl (AI Config) inventory.
# LaunchDarkly: AgentControl · AI Configs
# https://docs.launchdarkly.com/home/ai-configs
# sources: filled by ldctl instrument --write.

agent_configs:
- key: equity-briefing-completion
  name: Equity briefing completion
  mode: completion
  examples:
  - path: 20-agent-config/21-agent-completion-config
  variations:
  - key: baseline-analyst
    model_config_key: Custom.gemma2-2b
  - key: concise-skeptic
    model_config_key: Custom.llama3.2-3b
  - key: reckless-hype
    model_config_key: Custom.llama3.2-1b
  model_configs:
  - key: Custom.llama3.2-3b
    model_id: llama3.2:3b
  - key: Custom.gemma2-2b
    model_id: gemma2:2b
  - key: Custom.llama3.2-1b
    model_id: llama3.2:1b
  sources:
  - path: 20-agent-config/21-agent-completion-config/java/src/main/java/AgentCore.java
    role: evaluation
  - path: 20-agent-config/21-agent-completion-config/node/agentCore.js
    role: evaluation
  - path: 20-agent-config/21-agent-completion-config/python/agent_core.py
    role: evaluation
  - path: 20-agent-config/21-agent-completion-config/dotnet/AgentCore.cs
    role: evaluation
  - path: 20-agent-config/21-agent-completion-config/rest/common.sh
    role: provisioning

- key: equity-briefing-tracked-completion
  name: Equity briefing tracked completion
  mode: completion
  examples:
  - path: 20-agent-config/22-config-outside-code
  variations:
  - key: tracked-ollama
    model_config_key: Custom.llama3.2-1b
  - key: tracked-anthropic
    model_id: claude-sonnet-5
  model_configs:
  - key: Custom.llama3.2-1b
    model_id: llama3.2:1b
  sources:
  - path: 20-agent-config/22-config-outside-code/python/agent_core.py
    role: evaluation
  - path: 20-agent-config/22-config-outside-code/node/agentCore.js
    role: evaluation
  - path: 20-agent-config/22-config-outside-code/java/src/main/java/AgentCore.java
    role: evaluation
  - path: 20-agent-config/22-config-outside-code/dotnet/AgentCore.cs
    role: evaluation
  - path: 20-agent-config/22-config-outside-code/rest/common.sh
    role: provisioning

- key: equity-briefing-tools
  name: Equity briefing tools
  mode: completion
  examples:
  - path: 20-agent-config/23-agent-tools
  variations:
  - key: tools-anthropic
    model_id: claude-sonnet-5
  tools:
  - key: analyze-ticker-stories
  - key: compare-ticker-analyses
  sources:
  - path: 20-agent-config/23-agent-tools/python/agent_core.py
    role: evaluation
  - path: 20-agent-config/23-agent-tools/node/agentCore.js
    role: evaluation
  - path: 20-agent-config/23-agent-tools/java/src/main/java/AgentCore.java
    role: evaluation
  - path: 20-agent-config/23-agent-tools/dotnet/AgentCore.cs
    role: evaluation
  - path: 20-agent-config/23-agent-tools/rest/common.sh
    role: provisioning
  - path: 20-agent-config/23-agent-tools/rest/create-tools.sh
    role: provisioning
